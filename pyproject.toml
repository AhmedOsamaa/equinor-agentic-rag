[project]
name = "equinor-agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.3.16",
    "chromadb>=1.5.9",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "tenacity>=9.2.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
