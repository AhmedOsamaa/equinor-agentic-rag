<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Evaluation Dashboard</title>
<style>
  :root { --bg:#0b1020; --panel:#1b2236; --ink:#e8ecf5; --muted:#9aa4bd; --btn:#4f46e5; --card:#f4f4f5; --cardink:#18181b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
  h1 { margin:0 0 4px; font-size:26px; }
  h2 { margin:34px 0 12px; font-size:21px; }
  .sub { color:var(--muted); margin:0 0 6px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:10px 0 12px; color:var(--muted); font-size:13px; }
  select, input { background:var(--panel); color:var(--ink); border:1px solid #33405e; border-radius:6px; padding:5px 8px; font:inherit; }
  input { width:11ch; }
  button.run { width:100%; background:var(--btn); color:#fff; border:0; border-radius:6px; padding:11px; font:600 15px inherit; cursor:pointer; }
  button.run:hover:not(:disabled) { filter:brightness(1.12); }
  button.run:disabled { opacity:.55; cursor:default; }
  .grid { display:grid; grid-template-columns:minmax(260px,5fr) 7fr; gap:22px; margin-top:20px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); color:var(--cardink); border-radius:6px; padding:12px 16px; margin-bottom:12px; border-left:4px solid #f59e0b; }
  .card.green { border-left-color:#16a34a; }
  .card .name { font-size:14px; color:#52525b; }
  .card .val { font-size:30px; font-weight:700; color:#f59e0b; }
  .card.green .val { color:#15803d; }
  .card .ci { font-size:12px; color:#52525b; }
  .banner { border-radius:6px; padding:10px 14px; text-align:center; font-weight:600; background:#d1fae5; color:#065f46; }
  .banner.run { background:#fef3c7; color:#92400e; }
  .banner.err { background:#fee2e2; color:#991b1b; }
  .banner.idle { background:#27304a; color:var(--muted); font-weight:400; }
  .bar { height:6px; background:#27304a; border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--btn); transition:width .4s; }
  .chart { background:var(--panel); border-radius:6px; padding:12px; }
  .chart h3 { margin:0 0 4px; text-align:center; font-size:15px; }
  .legend { display:flex; gap:16px; justify-content:center; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
  .placeholder { display:flex; align-items:center; justify-content:center; color:var(--muted); min-height:150px; }
  svg text { fill:#c4cbe0; font-size:11px; }
</style>
</head>
<body>
<main>
  <h1>RAG Evaluation Dashboard</h1>
  <p class="sub">Retrieval and answer quality for the six energy documents. Every number is read from results/results.json.</p>

  <h2>Retrieval Evaluation</h2>
  <div class="controls">
    <label>Split to run <select id="split"><option value="dev">dev</option><option value="test">test</option></select></label>
    <label>Results tag <input id="tag" value="simple" maxlength="20"></label>
    <span>|</span>
    <label>Show run <select id="key"></select></label>
    <label>Tier <select id="tier"></select></label>
    <label>Mode <select id="mode"></select></label>
    <label>Chart metric <select id="metric"></select></label>
    <label>Group by <select id="group"><option value="tier">tier</option><option value="type">question type (all tiers pooled)</option></select></label>
  </div>
  <button class="run" id="run">Run Evaluation</button>

  <div class="grid">
    <div>
      <div class="card" id="c-mrr"></div>
      <div class="card" id="c-ndcg"></div>
      <div class="card green" id="c-cov"></div>
      <div class="banner idle" id="banner">Loading…</div>
      <div class="bar"><div id="fill"></div></div>
    </div>
    <div class="chart">
      <h3 id="ctitle"></h3>
      <div class="legend" id="legend"></div>
      <svg id="svg" width="100%" viewBox="0 0 700 330" role="img"></svg>
      <div class="note" id="cnote"></div>
    </div>
  </div>

  <h2>Answer Evaluation</h2>
  <button class="run" disabled>Run Evaluation (the agent is not built yet)</button>
  <div class="grid"><div class="placeholder">Not available yet</div><div class="chart placeholder">&nbsp;</div></div>
</main>

<script>
const SV = __SERVER__;
const MODES = ["vector", "hybrid", "hybrid_rerank"];
const COLORS = { vector: "#818cf8", hybrid: "#f59e0b", hybrid_rerank: "#2dd4bf" };
const METRICS = { "mrr@10": "MRR@10", "ndcg@10": "nDCG@10", "coverage@10": "Coverage@10", "hit@10": "Hit@10", "hit@5": "Hit@5" };
const $ = (id) => document.getElementById(id);
let RESULTS = {};
let waiting = false;

function fill(sel, pairs, keep) {
  const old = keep ? sel.value : "";
  sel.replaceChildren(...pairs.map(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; return o; }));
  if (old && pairs.some((p) => p[0] === old)) sel.value = old;
}
function card(el, name, m, pct, n) {
  const f = (x) => (pct ? (100 * x).toFixed(1) + "%" : x.toFixed(4));
  el.replaceChildren();
  for (const [cls, text] of [["name", name], ["val", f(m.mean)], ["ci", "95% CI [" + f(m.ci_low) + ", " + f(m.ci_high) + "], n = " + n]]) {
    const d = document.createElement("div"); d.className = cls; d.textContent = text; el.appendChild(d);
  }
}
function svgEl(tag, attrs, text) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  const run = RESULTS[$("key").value];
  if (!run) return;
  const tier = $("tier").value, mode = $("mode").value, metric = $("metric").value;
  const block = run.tiers[tier];
  card($("c-mrr"), "Mean Reciprocal Rank (MRR@10), " + mode, block.modes[mode]["mrr@10"], false, block.n);
  card($("c-ndcg"), "Normalized DCG (nDCG@10), " + mode, block.modes[mode]["ndcg@10"], false, block.n);
  card($("c-cov"), "Gold-page coverage@10, " + mode, block.modes[mode]["coverage@10"], true, block.n);

  // chart: groups on the x axis, one bar per mode, with the 95% bootstrap interval as a whisker
  const byType = $("group").value === "type";
  const groups = byType
    ? Object.entries(run.breakdowns.type).map(([k, v]) => ({ label: k + " (n=" + v.n + ")", modes: v.modes }))
    : Object.entries(run.tiers).map(([k, v]) => ({ label: k + " (n=" + v.n + ")", modes: v.modes }));
  $("ctitle").textContent = METRICS[metric] + " by " + (byType ? "question type" : "tier") + " (" + $("key").value + ")";
  $("cnote").textContent = byType
    ? "Question types pool all three tiers, so read them as descriptive only. Whiskers are 95% bootstrap intervals."
    : "Whiskers are 95% bootstrap intervals; with small n they are wide and bars that differ may not differ.";
  $("legend").replaceChildren(...MODES.map((m) => { const s = document.createElement("span"); const i = document.createElement("i"); i.style.background = COLORS[m]; s.append(i, m); return s; }));

  const svg = $("svg"); svg.replaceChildren();
  const L = 40, R = 690, T = 12, B = 280, H = B - T;
  const y = (v) => B - v * H;
  for (let t = 0; t <= 10; t += 2) {
    svg.appendChild(svgEl("line", { x1: L, x2: R, y1: y(t / 10), y2: y(t / 10), stroke: "#2c3552" }));
    svg.appendChild(svgEl("text", { x: L - 6, y: y(t / 10) + 4, "text-anchor": "end" }, (t / 10).toFixed(1)));
  }
  const gw = (R - L) / groups.length, bw = Math.min(26, (gw - 14) / MODES.length);
  groups.forEach((g, gi) => {
    const x0 = L + gi * gw + (gw - bw * MODES.length) / 2;
    MODES.forEach((m, mi) => {
      const s = g.modes[m][metric], x = x0 + mi * bw;
      svg.appendChild(svgEl("rect", { x: x + 1, y: y(s.mean), width: bw - 2, height: B - y(s.mean), fill: COLORS[m] }));
      svg.appendChild(svgEl("line", { x1: x + bw / 2, x2: x + bw / 2, y1: y(s.ci_low), y2: y(s.ci_high), stroke: "#e8ecf5", "stroke-width": 1.5 }));
    });
    const lab = svgEl("text", { x: L + gi * gw + gw / 2, y: B + 18, "text-anchor": "middle" }, g.label);
    svg.appendChild(lab);
  });
}

function showRun(run) {
  const keys = Object.keys(RESULTS).sort((a, b) => RESULTS[b].time_utc.localeCompare(RESULTS[a].time_utc)); // newest first
  fill($("key"), keys.map((k) => [k, k + (RESULTS[k].pilot ? " (dev pilot)" : " (" + RESULTS[k].split + ")")]), false);
  if (run && RESULTS[run]) $("key").value = run;
  const r = RESULTS[$("key").value];
  if (!r) { $("banner").textContent = "No results yet. Press Run Evaluation."; return; }
  fill($("tier"), Object.keys(r.tiers).map((t) => [t, t]), true);
  render();
}

async function loadResults(select) {
  RESULTS = await (await fetch("/api/results", { cache: "no-store" })).json();
  fill($("mode"), MODES.map((m) => [m, m]), true);
  fill($("metric"), Object.entries(METRICS), true);
  showRun(select);
}

function setBanner(cls, text) { $("banner").className = "banner " + cls; $("banner").textContent = text; }

async function poll() {
  const st = await (await fetch("/api/status", { cache: "no-store" })).json();
  const pct = st.total ? Math.round((100 * st.done) / st.total) : 0;
  $("fill").style.width = (st.state === "running" ? pct : st.state === "done" ? 100 : 0) + "%";
  $("run").disabled = st.state === "running";
  if (st.state === "running") {
    setBanner("run", "Running " + st.split + " (" + st.mode + "): " + st.done + " of " + st.total + " steps, " + pct + "%");
    setTimeout(poll, 700);
  } else if (st.state === "done") {
    if (waiting) { waiting = false; await loadResults(st.key); }
    const r = RESULTS[st.key];
    setBanner("", "Evaluation complete: " + st.key + (r ? " (" + r.tiers.round_1.n + "+" + r.tiers.round_2.n + "+" + r.tiers.round_3.n + " questions)" : ""));
  } else if (st.state === "error") {
    setBanner("err", "Run failed: " + (st.message || "see the server terminal"));
  } else {
    setBanner("idle", "Idle. Showing the most recent stored run.");
  }
}

$("run").addEventListener("click", async () => {
  const body = { split: $("split").value, tag: $("tag").value.trim() };
  $("run").disabled = true; setBanner("run", "Starting " + body.split + "…");
  const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json", "X-Token": SV.token }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { setBanner("err", j.error || "could not start"); $("run").disabled = false; return; }
  waiting = true; poll();
});
$("split").addEventListener("change", () => { $("tag").value = $("split").value === "test" ? "rerun" : "simple"; });
["key", "tier", "mode", "metric", "group"].forEach((id) => $(id).addEventListener("change", id === "key" ? () => showRun($("key").value) : render));

loadResults().then(poll);
</script>
</body>
</html>
